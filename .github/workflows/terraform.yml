name: Terraform CD
on: 
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: 
          - apply
          - destroy
        description: please select apply or destroy

      region:
        type: choice
        options: 
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2  
        description: please type select region

      instace_type:
        type: string
        description: please provide instance type
        
      instace_name :
        type: string
        description: please provide instance name

    
      region:
        type: string
        description: please enter the AWS region
      instance_type:
        type: string
        description: please enter the instance type
      instance_name:
        type: string
        description: please enter the instance name


jobs: 
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout repository

      - name: Download Terraform
        uses: hashicorp/setup-terraform@v4


      - name: Secret key
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform destroy -auto-approve
      
      
    